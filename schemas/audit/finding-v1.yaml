name: ope.audit.finding
version: 1
required:
  - id
  - module
  - symptom
  - evidence
  - evidence_status
  - execution_status
  - priority
  - remediation
  - validation
evidence_status_enum:
  - FACT
  - OBSERVED
  - ESTIMATE
  - HYPOTHESIS
  - EXPERIMENT
  - DEPRECATED
execution_status_enum:
  - PASS
  - FAIL
  - UNKNOWN
  - BLOCKED
  - N/A
severity_enum:
  - critical
  - high
  - medium
  - low
  - info
fields:
  id: string
  entity: string
  module: string
  subsystem: string
  asset: string
  symptom: string
  root_cause: string
  evidence: list[evidence]
  evidence_status: evidence_status_enum
  execution_status: execution_status_enum
  severity: severity_enum
  priority: number(0..100)
  impact: object
  remediation: list[string]
  validation: list[string]
  regression_guard: list[string]
evidence:
  required: [source, observed_at]
  fields:
    source: string
    url: string
    observed_at: datetime
    value: any
    confidence: number(0..1)

rules:
  - UNKNOWN is not PASS.
  - Missing evidence cannot produce PASS.
  - A hypothesis must not be presented as a fact.
  - Provider estimates retain estimate status.
