name: ope.audit.run
version: 1
# Reconciled to the STABLE emitted contract (engine_contract:
# evidence-diagnostic-v1) produced by ope.engine.normalize_result /
# normalize_site_result / normalize_performance_result. The implementation is
# the source of truth for this contract; tests/test_schema_contract.py asserts
# that real engine output conforms to the fields declared here, so schema and
# runtime cannot silently diverge.
engine_contract: evidence-diagnostic-v1
required: [run_id, target, started_at, engine_contract, modules, findings, summary]
fields:
  run_id: string                 # e.g. "ope-1700000000"
  target: string                 # normalized target URL (a string, not an object)
  final_url: string              # resolved URL after redirects (single-page audit)
  started_at: number             # epoch seconds (float)
  completed_at: number           # epoch seconds (float)
  version: string                # package version, e.g. "1.3.0"
  engine_contract: string        # always "evidence-diagnostic-v1"
  engine_scope: string           # "site" or "performance"; absent for a single-page audit
  status: string                 # site/performance runs only: COMPLETED | RUNNING | INVALID_TARGET
  inventory: object              # deterministic observation surface
  modules: object                # module_number ("01".."20") -> module_result
  findings: array                # list of ope.audit.finding records
  summary: object                # finding_count + per-severity counts
  checks: object                 # check_id -> check_result
  health: number|null            # dependency-aware global health; null when nothing is scored
  health_basis: object           # provenance of the health number
  dependency_root_causes: object # module_number -> [upstream module_numbers]
  remediation_plan: object       # dependency-ordered remediation plan
  reasoning: object              # optional advisory layer (present only with --reason / dashboard)
module_result:
  required: [status, findings]
  status: [PASS, FAIL, UNKNOWN, BLOCKED, N/A]   # BLOCKED is a derived module-level state
  fields:
    status: enum
    findings: array              # finding ids attributed to this module
    score: number|null           # null for BLOCKED or otherwise unscored modules
    score_basis: object          # provenance of the module score
    blocked_by: array            # upstream module_numbers (BLOCKED modules only)
check_result:
  required: [check_id, status]
  status: [PASS, FAIL, UNKNOWN, N/A]            # checks are never BLOCKED (that is module-level)
  fields:
    check_id: string
    module: string               # e.g. "02-infrastructure"
    status: enum
    evidence: array
    findings: array
    reason: string
    duration_ms: number
