[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-presence-engine"
version = "1.2.0"
description = "Evidence-driven digital presence audit and root-cause engine"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
lint = ["ruff>=0.8", "mypy>=1.13"]
# Optional: headless-browser rendering for PDF/PNG dashboard exports.
# The core engine and dashboard work without it (PDF/PNG report a clean
# "unavailable" state rather than producing a fake file).
report = ["playwright>=1.40"]

[project.scripts]
ope = "ope.cli:main"
ope-audit = "ope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the RawBlock design stylesheet so standalone HTML reports can inline it
# from installed environments (report_html.py also searches the source tree).
[tool.setuptools.data-files]
"share/ope" = ["design/rawblock.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--tb=short"]

[tool.ruff]
target-version = "py310"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E701",   # multiple statements on one line (colon) — intentional compact style
    "E702",   # multiple statements on one line (semicolon) — intentional compact style
    "E501",   # line too long — handled by line-length setting above
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
