[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-presence-engine"
version = "0.1.1"
description = "Evidence-driven digital presence audit and root-cause engine"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
ope = "ope.cli:main"
ope-audit = "ope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the RawBlock design stylesheet so standalone HTML reports can inline it
# from installed environments (report_html.py also searches the source tree).
[tool.setuptools.data-files]
"share/ope" = ["design/rawblock.css"]
